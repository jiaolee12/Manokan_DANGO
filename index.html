<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manok sa Bukid – Probinsya Poultry</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5ec;--card:#fff;--ink:#1d2a1c;--mut:#5b6b58;--green:#1f5d3a;--blue:#0b3d91;--gold:#f2b705;--red:#c8242b;--line:#d5ddc9;--hero:#1f5d3a;--herotx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a12;--card:#1b251a;--ink:#eaf0e2;--mut:#a3b39e;--green:#6fcf97;--blue:#8fb4ff;--line:#2e3d2c;--hero:#0f3a24}}
:root[data-theme="dark"]{--bg:#131a12;--card:#1b251a;--ink:#eaf0e2;--mut:#a3b39e;--green:#6fcf97;--blue:#8fb4ff;--line:#2e3d2c;--hero:#0f3a24}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:30}
h1,h2,h3{font-family:Bitter,Georgia,serif;line-height:1.15;margin:0}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hero);color:#fff;z-index:20;border-bottom:4px solid var(--gold)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.logo{font:800 20px Bitter,serif;text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700}
nav a.on,nav a:hover{background:rgba(255,255,255,.18)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:700 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.red):not(.gold),:root:not([data-theme="light"]) .chip.on{color:#0b1a12}}:root[data-theme=dark] .btn:not(.ghost):not(.red):not(.gold),:root[data-theme=dark] .chip.on{color:#0b1a12}
.btn.sm{padding:8px 12px;font-size:14px}.btn.gold{background:var(--gold);color:#241a00}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.red{background:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--hero);color:var(--herotx);position:relative;overflow:hidden}
.hero .wrap{padding-top:44px;padding-bottom:150px;position:relative;z-index:2}
.hero h1{font-size:clamp(34px,7vw,64px);max-width:12em}
.hero p{max-width:34em;font-size:18px;opacity:.92}
.hero svg{position:absolute;left:0;bottom:-1px;width:100%;height:150px;z-index:1}
.weave{height:14px;background:repeating-linear-gradient(45deg,var(--red) 0 10px,var(--gold) 10px 20px,var(--blue) 20px 30px)}
section{padding:36px 0}
h2{font-size:clamp(24px,4vw,34px);margin-bottom:6px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#ddd}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.cb h3{font-size:19px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--mut);margin:0;font-size:14px}.desc{margin:0;font-size:14px;flex:1}
.price{font:800 20px Bitter,serif;color:var(--green)}
.age{background:var(--gold);color:#241a00;font-weight:700;font-size:13px;padding:2px 10px;border-radius:99px}
.tag{font-size:13px;font-weight:700}.tag.ok{color:var(--green)}.tag.low{color:#b26a00}.tag.out{color:var(--red)}
.cats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cat{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--gold);border-radius:12px;padding:12px;text-decoration:none}
.cat img{width:84px;height:84px;object-fit:cover;border-radius:10px}.cat b{font:800 19px Bitter,serif;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:700 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.dark-on .chip.on{color:#0c1f12}
.why{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.why div{border-top:4px solid var(--blue);padding-top:10px}.why h3{font-size:18px;margin-bottom:4px}
.detail{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
.detail img{width:100%;border-radius:14px;border:1px solid var(--line)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:16px 0}dt{color:var(--mut)}dd{margin:0;font-weight:700}
input,select,textarea{width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.f .full{grid-column:1/-1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stats b{font:800 24px Bitter,serif;display:block;color:var(--green)}
dialog{border:0;border-radius:16px;padding:20px;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
footer{background:var(--hero);color:#fff;padding:26px 0;margin-top:30px;font-size:14px}
@media (max-width:560px){.logo{font-size:17px}nav a{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

seed[0].cat=4;
const K="msb_p2",OK="msb_o2",CK="msb_c2";
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Browser storage is full – use a smaller photo")}};
let P=ld(K,null)||seed,ORD=ld(OK,[]),cart=ld(CK,{}),admin=false,editing=null,pend=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const peso=n=>"₱"+Number(n).toLocaleString("en-PH"),CAT={4:"4 months old",5:"5 months old",6:"6 months & older"};
const src=p=>IMG[p.img]||p.img,find=id=>P.find(p=>p.id===id);
const save=()=>{sv(K,P);sv(OK,ORD);sv(CK,cart);$("#cn").textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2400)}
const stag=p=>p.stock<=0?'<span class="tag out">Sold out</span>':p.stock<=3?`<span class="tag low">Only ${p.stock} left</span>`:`<span class="tag ok">${p.stock} available</span>`;
const card=p=>`<article class="card"><a href="#/p/${p.id}"><img src="${src(p)}" alt="${esc(p.name)}, ${p.age}-month-old ${esc(p.breed)}" loading="lazy"></a><div class="cb"><div class="row"><span class="age">${p.age} months</span>${stag(p)}</div><h3><a href="#/p/${p.id}" style="text-decoration:none">${esc(p.name)}</a></h3><p class="muted">${esc(p.breed)} · ${esc(p.sex)}</p><p class="desc">${esc(p.desc)}</p><div class="row"><b class="price">${peso(p.price)}</b><button class="btn sm" ${p.stock<=0?"disabled":""} onclick="add('${p.id}')">Add to basket</button></div></div></article>`;
function home(){const f=P.filter(p=>p.feat&&p.stock>0).slice(0,3);
return `<div class="hero"><div class="wrap"><h1>Healthy manok, raised in the open air of the province.</h1><p>From our family farm among the rice terraces and coconut groves, we raise native and heritage chickens, free-range and fed on palay, corn and greens. Choose your birds by age and take them home.</p><p><a class="btn gold" href="#/shop/all">Browse chickens</a></p></div>
<svg viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true"><circle cx="1020" cy="40" r="34" fill="#f2b705"/><path d="M0 100 Q150 30 320 90 T640 80 T960 95 T1200 70 V150 H0Z" fill="#2f7a4b"/><path d="M0 130 Q200 90 400 120 T800 115 T1200 120 V150 H0Z" fill="var(--bg)"/><g fill="#7a4a1d"><path d="M140 106 l36-30 36 30z"/><rect x="152" y="106" width="48" height="18"/></g></svg></div><div class="weave"></div>
<section><div class="wrap"><h2>Shop by age</h2><p class="sub">Younger birds are cheaper and adapt quickly; older birds lay sooner.</p><div class="cats">${[4,5,6].map(c=>{const l=P.filter(p=>p.cat===c);return `<a class="cat" href="#/shop/${c}"><img src="${l[0]?src(l[0]):IMG["i"+(c-3)]}" alt=""><span><b>${CAT[c]}</b>${l.reduce((a,p)=>a+Math.max(0,p.stock),0)} birds in stock</span></a>`}).join("")}</div></div></section>
<section><div class="wrap"><h2>Featured chickens</h2><p class="sub">Hand-picked by our farmers this week.</p><div class="grid">${f.map(card).join("")||'<p>No featured chickens right now. Browse the full shop.</p>'}</div></div></section>
<section><div class="wrap"><div class="why"><div><h3>Free-range and healthy</h3><p>Raised outdoors, vaccinated and checked before every sale.</p></div><div><h3>Honest prices</h3><p>Priced straight from the farm in pesos, with no middleman.</p></div><div><h3>Delivery across the province</h3><p>Pick up at the farm or have your birds delivered to your barangay.</p></div></div></div></section>`}
function shop(a){a=a||"all";const l=P.filter(p=>a==="all"||p.cat==a);
return `<section><div class="wrap"><h2>Our chickens</h2><p class="sub">${l.length} listing${l.length==1?"":"s"}</p><div class="chips">${[["all","All"],[4,"4 months"],[5,"5 months"],[6,"6 months & older"]].map(([k,t])=>`<a class="chip ${a==k?"on":""}" href="#/shop/${k}">${t}</a>`).join("")}</div><div class="grid">${l.map(card).join("")||"<p>No chickens in this category yet.</p>"}</div></div></section>`}
function detail(id){const p=find(id);if(!p)return shop();
return `<section><div class="wrap"><p><a href="#/shop/${p.cat}">← Back to ${CAT[p.cat]}</a></p><div class="detail"><img src="${src(p)}" alt="${esc(p.name)}, ${esc(p.breed)}"><div><span class="age">${CAT[p.cat]}</span><h2 style="margin-top:8px">${esc(p.name)}</h2><b class="price" style="font-size:28px">${peso(p.price)}</b> ${stag(p)}<p>${esc(p.desc)}</p><dl><dt>Breed</dt><dd>${esc(p.breed)}</dd><dt>Age</dt><dd>${p.age} months</dd><dt>Sex</dt><dd>${esc(p.sex)}</dd><dt>Weight</dt><dd>${p.weight} kg</dd><dt>Health</dt><dd>Vaccinated, dewormed</dd><dt>Stock</dt><dd>${Math.max(0,p.stock)} available</dd></dl><button class="btn" ${p.stock<=0?"disabled":""} onclick="add('${p.id}')">Add to basket</button></div></div></div></section>`}
function add(id){const p=find(id),q=cart[id]||0;if(q>=p.stock)return toast("That is all we have in stock");cart[id]=q+1;save();toast(p.name+" added to basket")}
function openCart(){const d=$("#dlg"),it=Object.entries(cart).map(([id,q])=>[find(id),q]).filter(x=>x[0]);const t=it.reduce((a,[p,q])=>a+p.price*q,0);
d.innerHTML=`<h2>Your basket</h2>${it.map(([p,q])=>`<div class="li"><span>${esc(p.name)}<br><small class="muted">${peso(p.price)} each</small></span><span><button class="btn ghost sm" onclick="qty('${p.id}',-1)" aria-label="Fewer">−</button> ${q} <button class="btn ghost sm" onclick="qty('${p.id}',1)" aria-label="More">+</button></span></div>`).join("")||'<p>Your basket is empty. Add a chicken from the shop.</p>'}
${it.length?`<p class="row"><b>Total</b><b class="price">${peso(t)}</b></p><div class="f"><div><label for="on">Full name</label><input id="on"></div><div><label for="op">Mobile number</label><input id="op" inputmode="tel"></div><div class="full"><label for="oa">Barangay, town and province</label><textarea id="oa" rows="2"></textarea></div></div><p><button class="btn" onclick="order()">Place order</button></p>`:""}
<button class="btn ghost sm" onclick="$('#dlg').close()">Close</button>`;d.showModal()}
function qty(id,n){const p=find(id);cart[id]=Math.min(p.stock,(cart[id]||0)+n);if(cart[id]<=0)delete cart[id];save();openCart()}
function order(){const n=$("#on").value.trim(),ph=$("#op").value.trim(),a=$("#oa").value.trim();if(!n||!ph||!a)return toast("Fill in your name, number and address");
const items=Object.entries(cart).map(([id,q])=>({name:find(id).name,qty:q,price:find(id).price}));Object.entries(cart).forEach(([id,q])=>find(id).stock-=q);
ORD.unshift({id:"MB"+Date.now().toString().slice(-6),date:new Date().toLocaleString("en-PH"),n,ph,a,items,total:items.reduce((s,i)=>s+i.qty*i.price,0),st:"New"});cart={};save();
$("#dlg").innerHTML=`<h2>Salamat, ${esc(n)}!</h2><p>Your order <b>${ORD[0].id}</b> is received. We will text ${esc(ph)} to confirm pickup or delivery.</p><button class="btn" onclick="$('#dlg').close();route()">Done</button>`}
function admin_(){if(!admin)return `<section><div class="wrap" style="max-width:420px"><h2>Admin sign in</h2><p class="sub">Demo passcode: <b>admin123</b></p><label for="pw">Passcode</label><input id="pw" type="password"><p><button class="btn" onclick="if($('#pw').value==='admin123'){admin=true;route()}else toast('Wrong passcode')">Sign in</button></p></div></section>`;
const e=editing?find(editing):{name:"",breed:"",age:4,cat:4,sex:"Pullet",weight:1.5,price:"",stock:1,desc:"",img:"i1",feat:false};
return `<section><div class="wrap"><div class="row"><h2>Admin dashboard</h2><span><button class="btn ghost sm" onclick="if(confirm('Reset all data to the sample listings?')){P=seed;ORD=[];cart={};save();route()}">Reset data</button> <button class="btn ghost sm" onclick="admin=false;route()">Sign out</button></span></div>
<div class="stats"><div><b>${P.length}</b>Listings</div><div><b>${P.reduce((a,p)=>a+p.stock,0)}</b>Birds in stock</div><div><b>${peso(P.reduce((a,p)=>a+p.stock*p.price,0))}</b>Inventory value</div><div><b>${ORD.filter(o=>o.st=="New").length}</b>New orders</div></div>
<div class="panel"><h3>${editing?"Edit listing":"Add a chicken"}</h3><div class="f" style="margin-top:12px">
<div><label for="fn">Name</label><input id="fn" value="${esc(e.name)}"></div><div><label for="fb">Breed</label><input id="fb" value="${esc(e.breed)}"></div>
<div><label for="fa">Age (months)</label><input id="fa" type="number" min="1" value="${e.age}"></div>
<div><label for="fc">Category</label><select id="fc">${[4,5,6].map(c=>`<option value="${c}" ${e.cat==c?"selected":""}>${CAT[c]}</option>`)}</select></div>
<div><label for="fs">Sex</label><select id="fs">${["Pullet","Hen","Cockerel","Rooster"].map(s=>`<option ${e.sex==s?"selected":""}>${s}</option>`)}</select></div>
<div><label for="fw">Weight (kg)</label><input id="fw" type="number" step="0.1" value="${e.weight}"></div>
<div><label for="fp">Price (₱)</label><input id="fp" type="number" min="0" value="${e.price}"></div><div><label for="fq">Stock</label><input id="fq" type="number" min="0" value="${e.stock}"></div>
<div class="full"><label for="fd">Description</label><textarea id="fd" rows="2">${esc(e.desc)}</textarea></div>
<div><label for="fi">Photo</label><select id="fi">${[["i1","Sample: red native"],["i2","Sample: barred rock"],["i3","Sample: lavender"]].map(([k,t])=>`<option value="${k}" ${e.img==k?"selected":""}>${t}</option>`)}</select></div>
<div><label for="fu">Or upload a photo</label><input id="fu" type="file" accept="image/*" onchange="up(this)"></div>
<div><label><input id="ff" type="checkbox" style="width:auto" ${e.feat?"checked":""}> Show on homepage</label></div></div>
<p><button class="btn" onclick="saveP()">${editing?"Save changes":"Add listing"}</button> ${editing?'<button class="btn ghost" onclick="editing=null;pend=null;route()">Cancel</button>':""}</p></div>
<div class="panel"><h3>Listings</h3><div class="scroll"><table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>${P.map(p=>`<tr><td><img src="${src(p)}" alt=""></td><td>${esc(p.name)}<br><small class="muted">${esc(p.breed)}, ${p.age} mo</small></td><td>${CAT[p.cat]}</td><td>${peso(p.price)}</td><td><button class="btn ghost sm" onclick="stk('${p.id}',-1)" aria-label="Less stock">−</button> ${p.stock} <button class="btn ghost sm" onclick="stk('${p.id}',1)" aria-label="More stock">+</button></td><td><button class="btn sm" onclick="editing='${p.id}';route();scrollTo(0,0)">Edit</button> <button class="btn red sm" onclick="del('${p.id}')">Delete</button></td></tr>`).join("")}</table></div></div>
<div class="panel"><h3>Orders</h3>${ORD.map((o,i)=>`<div class="li" style="align-items:flex-start"><span><b>${o.id}</b> · ${esc(o.n)} · ${esc(o.ph)}<br><small class="muted">${esc(o.a)}<br>${o.items.map(x=>x.qty+"× "+esc(x.name)).join(", ")} = <b>${peso(o.total)}</b></small></span><select style="width:auto" onchange="ORD[${i}].st=this.value;save()">${["New","Confirmed","Delivered","Cancelled"].map(s=>`<option ${o.st==s?"selected":""}>${s}</option>`)}</select></div>`).join("")||'<p class="muted">No orders yet. Orders placed from the basket appear here.</p>'}</div>
<p class="muted">Data is saved in this browser only (demo). Connect a database to share it across devices.</p></div></section>`}
function up(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,640/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pend=c.toDataURL("image/jpeg",.75);toast("Photo ready")};im.src=r.result};r.readAsDataURL(f)}
function saveP(){const g=i=>$("#"+i).value,o={name:g("fn").trim(),breed:g("fb").trim(),age:+g("fa"),cat:+g("fc"),sex:g("fs"),weight:+g("fw"),price:+g("fp"),stock:+g("fq"),desc:g("fd").trim(),img:pend||g("fi"),feat:$("#ff").checked};
if(!o.name||!o.price&&o.price!==0||!o.breed)return toast("Name, breed and price are required");
if(editing)Object.assign(find(editing),o);else P.push({id:"c"+Date.now(),...o});editing=null;pend=null;save();route();toast("Saved")}
function stk(id,n){const p=find(id);p.stock=Math.max(0,p.stock+n);save();route()}
function del(id){if(confirm("Delete this listing?")){P=P.filter(p=>p.id!==id);delete cart[id];save();route()}}
function route(){const[r,a]=(location.hash.slice(2)||"home").split("/");const v={home,shop:()=>shop(a),p:()=>detail(a),admin:admin_}[r]||home;$("#app").innerHTML=v();document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.r===(r=="p"?"shop":r)));save()}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});route();
</script></body></html>
